---
upgrade:
  - |
    Upgrade your Python to 3.11+. We no longer support Python 3.10 and below.
  - |
    Removed support for server/client clock drift detection, as well as the
    ``Future.clock_diff`` attribute. We don't use clock drift detection ever
    since we removed the "ETA polling" support in 2020.
other:
  - |
    Simplify code by using Python 3.11+ features where possible: ``StrEnum``,
    drop ``typing-extensions`` and ``python-dateutil`` in favor of stdlib
    functions, remove some dead code and 3.11 feature backports.
